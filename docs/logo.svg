<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="island">
  <!--
    La marca es la silueta del propio notch: canto recto arriba, esquinas
    redondeadas abajo y los dos enlaces concavos donde encuentra el borde.
    Dentro, la pildora azul del indicador de escritorios.

    Las mismas proporciones que dibuja render.notch() en la interfaz —
    26 de ancho por 17 de alto sobre 48, radio inferior 6, filete 4 —, de
    modo que la marca y el producto no pueden desincronizarse.

    La version PNG la genera brand/make-brand.py con el renderizador de
    la propia aplicacion; este SVG es su equivalente vectorial.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7B3FE4"/>
      <stop offset="1" stop-color="#5B2BE0"/>
    </linearGradient>
    <clipPath id="recorte">
      <rect width="48" height="48" rx="10.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#recorte)">
    <rect width="48" height="48" fill="url(#tile)"/>
    <path fill="#000000"
          d="M7,0 A4,4 0 0 1 11,4 L11,11 A6,6 0 0 0 17,17 L31,17
             A6,6 0 0 0 37,11 L37,4 A4,4 0 0 1 41,0 Z"/>
    <rect x="19" y="6.6" width="10" height="3.2" rx="1.6" fill="#0A84FF"/>
  </g>
</svg>
